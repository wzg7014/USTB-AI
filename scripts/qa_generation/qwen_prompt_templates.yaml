qa_generation_prompt: "\n基于以下USTB教务文档内容，生成5个高质量的问答对。\n\n要求：\n1. 问题要自然，符合学生真实查询习惯\n\
  2. 答案要准确，完全基于原文内容\n3. 覆盖不同问题类型：事实查询、流程指导、条件判断、解释说明等\n4. 避免生成\"请咨询教务处\"等无效回答\n5.\
  \ 问题要有层次，从简单到复杂\n\n教务文档内容：\n{content}\n\n请生成JSON格式的问答对，格式如下：\n[\n  {\n    \"question\"\
  : \"具体问题\",\n    \"answer\": \"基于原文的详细回答\",\n    \"question_type\": \"问题类型\",\n\
  \    \"category\": \"教务分类\"\n  }\n]\n"
quality_check_prompt: "\n请评估以下问答对的质量，从以下维度打分（1-5分）：\n\n1. 可回答性：问题能否从原文中找到答案\n2. 自然性：问题表达是否自然流畅\n\
  3. 准确性：答案是否准确完整\n4. 实用性：对用户是否有实际价值\n\n问答对：\n问题：{question}\n答案：{answer}\n原文：{content}\n\
  \n请返回JSON格式评分：\n{\n  \"可回答性\": 分数,\n  \"自然性\": 分数,\n  \"准确性\": 分数,\n  \"实用性\": 分数,\n\
  \  \"总分\": 平均分,\n  \"评价\": \"简短评价\"\n}\n"
system_prompt: 你是USTB教务助手的问答生成专家，专门基于教务文档生成高质量的问答对。
