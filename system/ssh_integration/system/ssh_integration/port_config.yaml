forwarding_rules:
  development_tools:
    conditions: null
    mappings:
    - tensorboard
    - jupyter
    name: 开发工具服务
    priority: 2
  ustb_services:
    conditions: null
    mappings:
    - rag_service
    - model_inference
    name: USTB教务助手核心服务
    priority: 1
port_mappings:
  jupyter:
    auto_start: false
    description: Jupyter Lab开发环境
    enabled: false
    local_port: 8888
    protocol: tcp
    remote_port: 8888
    service_name: jupyter
  model_inference:
    auto_start: true
    description: LoRA微调模型推理服务
    enabled: true
    local_port: 8001
    protocol: tcp
    remote_port: 8001
    service_name: model_inference
  rag_service:
    auto_start: true
    description: GPU加速RAG检索服务
    enabled: true
    local_port: 8000
    protocol: tcp
    remote_port: 8000
    service_name: rag_service
  tensorboard:
    auto_start: false
    description: TensorBoard监控服务
    enabled: false
    local_port: 6007
    protocol: tcp
    remote_port: 6007
    service_name: tensorboard
