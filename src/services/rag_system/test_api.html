<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTB RAG系统 API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
        .result { background: #f8f9fa; padding: 10px; border-radius: 3px; margin: 10px 0; }
        input { padding: 8px; margin: 5px; width: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>USTB RAG系统 API测试页面</h1>
        
        <div class="section">
            <h2>1. 健康检查</h2>
            <button onclick="checkHealth()">检查系统健康状态</button>
            <div id="healthResult" class="result"></div>
        </div>
        
        <div class="section">
            <h2>2. 文档检索</h2>
            <input type="text" id="searchQuery" placeholder="输入检索查询" value="选课通知">
            <input type="number" id="topK" placeholder="返回结果数量" value="3" min="1" max="10">
            <br>
            <button onclick="searchDocuments()">执行检索</button>
            <div id="searchResult" class="result"></div>
        </div>
        
        <div class="section">
            <h2>3. 系统统计</h2>
            <button onclick="getStats()">获取系统统计</button>
            <div id="statsResult" class="result"></div>
        </div>
        
        <div class="section">
            <h2>4. API响应日志</h2>
            <textarea id="apiLog" readonly></textarea>
            <button onclick="clearLog()">清除日志</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        function log(message) {
            const logArea = document.getElementById('apiLog');
            const timestamp = new Date().toLocaleTimeString();
            logArea.value += `[${timestamp}] ${message}\n`;
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('apiLog').value = '';
        }
        
        async function checkHealth() {
            try {
                log('发送健康检查请求...');
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                document.getElementById('healthResult').innerHTML = `
                    <h3>系统状态: ${data.status}</h3>
                    <p><strong>版本:</strong> ${data.version}</p>
                    <p><strong>Qdrant状态:</strong> ${data.qdrant_status}</p>
                    <p><strong>嵌入模型:</strong> ${data.embedding_model}</p>
                    <p><strong>文档数量:</strong> ${data.document_count}</p>
                    <p><strong>检查时间:</strong> ${data.timestamp}</p>
                `;
                log(`健康检查成功: ${data.status}, 文档数量: ${data.document_count}`);
            } catch (error) {
                document.getElementById('healthResult').innerHTML = `<p style="color: red;">错误: ${error.message}</p>`;
                log(`健康检查失败: ${error.message}`);
            }
        }
        
        async function searchDocuments() {
            try {
                const query = document.getElementById('searchQuery').value;
                const topK = parseInt(document.getElementById('topK').value);
                
                if (!query.trim()) {
                    alert('请输入检索查询');
                    return;
                }
                
                log(`发送检索请求: "${query}", top_k=${topK}`);
                
                const response = await fetch(`${API_BASE}/api/v1/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        top_k: topK
                    })
                });
                
                const data = await response.json();
                
                let resultHtml = `
                    <h3>检索结果 (${data.total}个结果, 响应时间: ${(data.response_time * 1000).toFixed(1)}ms)</h3>
                `;
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach((result, index) => {
                        resultHtml += `
                            <div style="border: 1px solid #eee; padding: 10px; margin: 10px 0; border-radius: 3px;">
                                <h4>${index + 1}. ${result.title}</h4>
                                <p><strong>相似度:</strong> ${result.score ? result.score.toFixed(3) : 'N/A'}</p>
                                <p><strong>分类:</strong> ${result.category || 'N/A'}</p>
                                <p><strong>内容:</strong> ${result.content ? result.content.substring(0, 200) + '...' : 'N/A'}</p>
                                <p><strong>链接:</strong> <a href="${result.url}" target="_blank">${result.url}</a></p>
                                ${result.attachments && result.attachments.length > 0 ? 
                                    `<p><strong>附件:</strong> ${result.attachments.map(att => `<a href="${att.url}" target="_blank">${att.title}</a>`).join(', ')}</p>` 
                                    : ''}
                            </div>
                        `;
                    });
                } else {
                    resultHtml += '<p>未找到相关结果</p>';
                }
                
                document.getElementById('searchResult').innerHTML = resultHtml;
                log(`检索完成: 找到${data.total}个结果, 响应时间${(data.response_time * 1000).toFixed(1)}ms`);
                
            } catch (error) {
                document.getElementById('searchResult').innerHTML = `<p style="color: red;">错误: ${error.message}</p>`;
                log(`检索失败: ${error.message}`);
            }
        }
        
        async function getStats() {
            try {
                log('获取系统统计信息...');
                const response = await fetch(`${API_BASE}/api/v1/stats`);
                const data = await response.json();
                
                document.getElementById('statsResult').innerHTML = `
                    <h3>系统统计信息</h3>
                    <h4>向量集合信息:</h4>
                    <p><strong>集合名称:</strong> ${data.collection.name}</p>
                    <p><strong>文档数量:</strong> ${data.collection.points_count}</p>
                    <p><strong>向量数量:</strong> ${data.collection.vectors_count || 'N/A'}</p>
                    <p><strong>状态:</strong> ${data.collection.status}</p>
                    <p><strong>向量维度:</strong> ${data.collection.vector_size}</p>
                    
                    <h4>嵌入模型信息:</h4>
                    <p><strong>模型名称:</strong> ${data.embedding_model.model_name}</p>
                    <p><strong>设备:</strong> ${data.embedding_model.device}</p>
                    <p><strong>向量维度:</strong> ${data.embedding_model.vector_size}</p>
                    <p><strong>批处理大小:</strong> ${data.embedding_model.batch_size}</p>
                    <p><strong>加载状态:</strong> ${data.embedding_model.is_loaded ? '已加载' : '未加载'}</p>
                `;
                log('系统统计信息获取成功');
            } catch (error) {
                document.getElementById('statsResult').innerHTML = `<p style="color: red;">错误: ${error.message}</p>`;
                log(`获取统计信息失败: ${error.message}`);
            }
        }
        
        // 页面加载时自动检查健康状态
        window.onload = function() {
            log('页面加载完成，准备测试API');
            checkHealth();
        };
    </script>
</body>
</html>
