<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTB数据质量监控仪表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
        }
        
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .metric-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-good { color: #27ae60; }
        .status-warning { color: #f39c12; }
        .status-danger { color: #e74c3c; }
        
        .charts-container {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .chart-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .alert-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 30px;
        }
        
        .alert-title {
            color: #856404;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .alert-item {
            padding: 8px 0;
            border-bottom: 1px solid #ffeaa7;
        }
        
        .alert-item:last-child {
            border-bottom: none;
        }
        
        .export-section {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
        }
        
        .export-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 0 10px;
            transition: background 0.3s ease;
        }
        
        .export-btn:hover {
            background: #2980b9;
        }
        
        .timestamp {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- 头部 -->
        <div class="header">
            <h1>🔬 USTB数据质量监控仪表板</h1>
            <p>数据科学专家 - 实时质量监控与分析</p>
        </div>
        
        <!-- 关键指标 -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">数据总量</div>
                <div class="metric-value status-good" id="totalCount">500</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">平均评分</div>
                <div class="metric-value status-good" id="avgScore">9.162</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">高质量数据</div>
                <div class="metric-value status-good" id="highQuality">80.8%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">异常值比例</div>
                <div class="metric-value status-good" id="outlierRate">2.0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">数据完整性</div>
                <div class="metric-value status-good" id="completeness">100%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">评分一致性</div>
                <div class="metric-value status-good" id="consistency">98.3%</div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">📊 评分分布</div>
                <canvas id="scoreDistChart" width="400" height="300"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">📈 分类分布</div>
                <canvas id="categoryChart" width="400" height="300"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">🔗 维度相关性</div>
                <canvas id="correlationChart" width="400" height="300"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">📉 质量趋势</div>
                <canvas id="trendChart" width="400" height="300"></canvas>
            </div>
        </div>
        
        <!-- 预警信息 -->
        <div class="alert-section">
            <div class="alert-title">⚠️ 质量预警</div>
            <div class="alert-item">
                <strong>分类不平衡:</strong> 通知通告占99.2%，建议增加其他分类数据
            </div>
            <div class="alert-item">
                <strong>评分区间窄:</strong> 评分集中在8.9-9.5分，建议扩大评分范围
            </div>
            <div class="alert-item">
                <strong>内容长度差异大:</strong> 最短107字符，最长4532字符，需要标准化
            </div>
        </div>
        
        <!-- 导出功能 -->
        <div class="export-section">
            <button class="export-btn" onclick="exportReport('png')">📊 导出PNG报告</button>
            <button class="export-btn" onclick="exportReport('pdf')">📄 导出PDF报告</button>
            <button class="export-btn" onclick="refreshData()">🔄 刷新数据</button>
        </div>
        
        <!-- 时间戳 -->
        <div class="timestamp">
            最后更新时间: <span id="lastUpdate"></span>
        </div>
    </div>

    <script>
        // 初始化图表
        function initCharts() {
            // 评分分布图
            const scoreCtx = document.getElementById('scoreDistChart').getContext('2d');
            new Chart(scoreCtx, {
                type: 'bar',
                data: {
                    labels: ['8.9-9.0', '9.0-9.1', '9.1-9.2', '9.2-9.3', '9.3-9.4', '9.4-9.5'],
                    datasets: [{
                        label: '数据量',
                        data: [45, 78, 125, 142, 85, 25],
                        backgroundColor: 'rgba(52, 152, 219, 0.8)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
            
            // 分类分布饼图
            const categoryCtx = document.getElementById('categoryChart').getContext('2d');
            new Chart(categoryCtx, {
                type: 'doughnut',
                data: {
                    labels: ['通知通告', '校内制度'],
                    datasets: [{
                        data: [496, 4],
                        backgroundColor: [
                            'rgba(52, 152, 219, 0.8)',
                            'rgba(231, 76, 60, 0.8)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
            
            // 维度相关性雷达图
            const corrCtx = document.getElementById('correlationChart').getContext('2d');
            new Chart(corrCtx, {
                type: 'radar',
                data: {
                    labels: ['完整性', '相关性', '时效性', '可用性', '准确性', '信息密度'],
                    datasets: [{
                        label: '与总分相关性',
                        data: [0.955, 0.829, 0.703, 0.928, 0.893, 0.962],
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 1
                        }
                    }
                }
            });
            
            // 质量趋势线图
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5'],
                    datasets: [{
                        label: '平均评分',
                        data: [9.15, 9.16, 9.17, 9.16, 9.16],
                        backgroundColor: 'rgba(46, 204, 113, 0.2)',
                        borderColor: 'rgba(46, 204, 113, 1)',
                        borderWidth: 2,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 9.0,
                            max: 9.3
                        }
                    }
                }
            });
        }
        
        // 导出报告功能
        function exportReport(format) {
            if (format === 'png') {
                // 模拟PNG导出
                alert('📊 PNG报告导出功能已触发\n实际项目中将生成包含所有图表的PNG文件');
            } else if (format === 'pdf') {
                // 模拟PDF导出
                alert('📄 PDF报告导出功能已触发\n实际项目中将生成完整的PDF质量报告');
            }
        }
        
        // 刷新数据功能
        function refreshData() {
            // 模拟数据刷新
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
            
            // 模拟指标更新
            const metrics = ['totalCount', 'avgScore', 'highQuality', 'outlierRate', 'completeness', 'consistency'];
            metrics.forEach(metric => {
                const element = document.getElementById(metric);
                element.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    element.style.transform = 'scale(1)';
                }, 200);
            });
            
            alert('🔄 数据已刷新\n实际项目中将重新加载最新的数据质量指标');
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
            
            // 模拟实时更新
            setInterval(() => {
                const now = new Date().toLocaleString('zh-CN');
                document.getElementById('lastUpdate').textContent = now;
            }, 30000); // 每30秒更新一次时间戳
        });
    </script>
</body>
</html>
