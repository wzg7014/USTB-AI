openapi: 3.0.3
info:
  title: USTB AI教务助手 API
  description: |
    北京科技大学AI教务助手后端服务API文档
    
    ## 功能特性
    - 🤖 智能聊天对话，集成RAG系统
    - 📚 教务分类管理和统计
    - 💬 用户反馈和评价系统
    - 👤 用户认证和权限管理
    - 📊 搜索历史和行为分析
    
    ## 认证方式
    使用Bearer Token进行身份认证，在请求头中添加：
    ```
    Authorization: Bearer <your-token>
    ```
    
    ## 响应格式
    所有API响应都遵循统一的JSON格式，包含适当的HTTP状态码和错误信息。
    
  version: 1.0.0
  contact:
    name: USTB AI教务助手开发团队
    email: support@ustb.edu.cn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8001
    description: 本地开发环境
  - url: https://api.ustb.edu.cn
    description: 生产环境

tags:
  - name: chat
    description: 聊天对话相关接口
  - name: categories
    description: 教务分类相关接口
  - name: feedback
    description: 用户反馈相关接口
  - name: health
    description: 系统健康检查接口

paths:
  /health:
    get:
      tags:
        - health
      summary: 系统健康检查
      description: 检查系统和各个服务组件的运行状态
      responses:
        '200':
          description: 系统运行正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                version: "1.0.0"
                timestamp: "2025-08-05T10:30:00Z"
                services:
                  rag_system: "healthy"
                  database: "healthy"

  /api/v1/chat:
    post:
      tags:
        - chat
      summary: 聊天对话
      description: |
        与USTB AI教务助手进行智能对话
        
        ## 功能特性
        - 支持教务问题咨询
        - 自动上下文管理
        - RAG系统集成搜索
        - 聊天历史记录
        
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: "如何进行选课？"
              session_id: null
              message_type: "text"
      responses:
        '200':
          description: 对话成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                session_id: "session_123"
                message: "选课流程如下：1. 登录教务系统..."
                message_id: "msg_456"
                timestamp: "2025-08-05T10:30:00Z"
                response_time: 1.23
                rag_results: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/chat/sessions:
    get:
      tags:
        - chat
      summary: 获取聊天会话列表
      description: 获取当前用户的所有聊天会话
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 返回数量限制
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSession'

  /api/v1/categories:
    get:
      tags:
        - categories
      summary: 获取教务分类列表
      description: |
        获取所有可用的教务分类和统计信息
        
        ## 返回信息
        - 分类基本信息（名称、描述、图标）
        - 文档数量统计
        - 最近搜索统计
        - 分类质量评分
        
      security:
        - BearerAuth: []
      parameters:
        - name: include_stats
          in: query
          description: 是否包含统计信息
          schema:
            type: boolean
            default: true
        - name: parent_id
          in: query
          description: 父分类ID过滤
          schema:
            type: string
        - name: level
          in: query
          description: 分类层级过滤
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              example:
                categories:
                  - id: "course_selection"
                    name: "选课管理"
                    display_name: "选课管理"
                    description: "课程选择、退课、课程表查询等"
                    icon: "📚"
                    document_count: 156
                    recent_searches: 23
                stats:
                  total_categories: 8
                  total_documents: 1024
                  recent_searches: 156
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/feedback:
    post:
      tags:
        - feedback
      summary: 提交用户反馈
      description: |
        提交对AI回答的反馈和评价
        
        ## 反馈类型
        - `helpful`: 有帮助
        - `not_helpful`: 没有帮助  
        - `irrelevant`: 不相关
        - `error`: 错误信息
        - `suggestion`: 建议改进
        
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
            example:
              query_id: "msg_456"
              feedback_type: "helpful"
              rating: 5
              comment: "回答很详细，很有帮助！"
      responses:
        '200':
          description: 反馈提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
              example:
                feedback_id: "feedback_789"
                message: "反馈提交成功，感谢您的宝贵意见！"
                status: "submitted"
                created_at: "2025-08-05T10:30:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      tags:
        - feedback
      summary: 获取用户反馈列表
      description: 获取当前用户提交的反馈记录
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 返回数量
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: 偏移量
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: feedback_type
          in: query
          description: 反馈类型过滤
          schema:
            type: string
            enum: [helpful, not_helpful, irrelevant, error, suggestion]
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT认证令牌

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - timestamp
        - services
      properties:
        status:
          type: string
          description: 系统状态
          example: "healthy"
        version:
          type: string
          description: 系统版本
          example: "1.0.0"
        timestamp:
          type: string
          format: date-time
          description: 响应时间戳
        services:
          type: object
          description: 各服务状态
          additionalProperties:
            type: string

    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: 用户消息
          minLength: 1
          maxLength: 2000
          example: "如何进行选课？"
        session_id:
          type: string
          description: 会话ID，不提供则创建新会话
          nullable: true
        message_type:
          type: string
          description: 消息类型
          default: "text"
        context:
          type: object
          description: 额外上下文信息
          nullable: true

    ChatResponse:
      type: object
      required:
        - session_id
        - message
        - message_id
        - timestamp
        - response_time
      properties:
        session_id:
          type: string
          description: 会话ID
        message:
          type: string
          description: AI回答
        message_id:
          type: string
          description: 消息ID
        timestamp:
          type: string
          format: date-time
          description: 响应时间戳
        response_time:
          type: number
          description: 处理时间(秒)
        rag_results:
          type: array
          description: RAG搜索结果
          items:
            $ref: '#/components/schemas/RAGResult'
        context_used:
          type: boolean
          description: 是否使用了上下文
          default: true

    ChatSession:
      type: object
      required:
        - session_id
        - user_id
        - title
        - created_at
        - updated_at
        - message_count
        - is_active
      properties:
        session_id:
          type: string
          description: 会话ID
        user_id:
          type: string
          description: 用户ID
        title:
          type: string
          description: 会话标题
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        message_count:
          type: integer
          description: 消息数量
        is_active:
          type: boolean
          description: 是否活跃

    RAGResult:
      type: object
      required:
        - id
        - title
        - content
        - score
        - category
        - url
      properties:
        id:
          type: string
          description: 文档ID
        title:
          type: string
          description: 文档标题
        content:
          type: string
          description: 文档内容摘要
        score:
          type: number
          description: 相似度评分
          minimum: 0
          maximum: 1
        category:
          type: string
          description: 文档分类
        url:
          type: string
          description: 原文链接
        attachments:
          type: array
          description: 附件列表
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string

    CategoryResponse:
      type: object
      required:
        - categories
        - stats
        - timestamp
      properties:
        categories:
          type: array
          description: 分类列表
          items:
            $ref: '#/components/schemas/CategoryDetail'
        stats:
          $ref: '#/components/schemas/CategoryStats'
        timestamp:
          type: string
          format: date-time
          description: 响应时间戳

    CategoryDetail:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          description: 分类ID
        name:
          type: string
          description: 分类名称
        display_name:
          type: string
          description: 显示名称
        description:
          type: string
          description: 分类描述
          nullable: true
        icon:
          type: string
          description: 分类图标
          nullable: true
        document_count:
          type: integer
          description: 文档数量
          default: 0
        recent_searches:
          type: integer
          description: 最近搜索次数
          default: 0
        avg_score:
          type: number
          description: 平均质量评分
          default: 0.0

    CategoryStats:
      type: object
      required:
        - total_categories
        - total_documents
        - recent_searches
        - avg_documents_per_category
      properties:
        total_categories:
          type: integer
          description: 总分类数
        total_documents:
          type: integer
          description: 总文档数
        recent_searches:
          type: integer
          description: 最近搜索总数
        avg_documents_per_category:
          type: number
          description: 平均每分类文档数
        most_popular_category:
          type: string
          description: 最热门分类ID
          nullable: true

    FeedbackRequest:
      type: object
      required:
        - feedback_type
      properties:
        query_id:
          type: string
          description: 关联的查询ID
          nullable: true
        result_id:
          type: string
          description: 关联的结果ID
          nullable: true
        feedback_type:
          type: string
          description: 反馈类型
          enum: [helpful, not_helpful, irrelevant, error, suggestion]
        rating:
          type: integer
          description: 评分(1-5)
          minimum: 1
          maximum: 5
          nullable: true
        comment:
          type: string
          description: 反馈评论
          maxLength: 1000
          nullable: true
        category:
          type: string
          description: 反馈分类
          nullable: true

    FeedbackResponse:
      type: object
      required:
        - feedback_id
        - message
        - status
        - created_at
      properties:
        feedback_id:
          type: string
          description: 反馈ID
        message:
          type: string
          description: 响应消息
        status:
          type: string
          description: 处理状态
        created_at:
          type: string
          format: date-time
          description: 创建时间

    FeedbackListResponse:
      type: object
      required:
        - feedback_list
        - total
        - limit
        - offset
        - has_more
      properties:
        feedback_list:
          type: array
          description: 反馈列表
          items:
            $ref: '#/components/schemas/FeedbackDetail'
        total:
          type: integer
          description: 总数量
        limit:
          type: integer
          description: 每页数量
        offset:
          type: integer
          description: 偏移量
        has_more:
          type: boolean
          description: 是否有更多数据

    FeedbackDetail:
      type: object
      required:
        - feedback_id
        - user_id
        - feedback_type
        - status
        - created_at
        - updated_at
      properties:
        feedback_id:
          type: string
          description: 反馈ID
        user_id:
          type: string
          description: 用户ID
        query_id:
          type: string
          description: 关联的查询ID
          nullable: true
        feedback_type:
          type: string
          description: 反馈类型
        rating:
          type: integer
          description: 评分
          nullable: true
        comment:
          type: string
          description: 反馈评论
          nullable: true
        status:
          type: string
          description: 处理状态
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 错误类型
        message:
          type: string
          description: 错误信息
        details:
          type: string
          description: 详细错误信息
          nullable: true

  responses:
    UnauthorizedError:
      description: 认证失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            message: "无效的认证令牌"

    ForbiddenError:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Forbidden"
            message: "权限不足"

    NotFoundError:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not Found"
            message: "请求的资源不存在"

    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal Server Error"
            message: "服务器内部错误，请稍后重试"
